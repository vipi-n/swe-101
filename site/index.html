<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A clean, searchable system design and interview prep notebook built from the swe-101 Markdown files."
    />
    <title>swe-101</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github.min.css"
    />
    <link rel="stylesheet" href="styles.css?v=24" />
  </head>
  <body>
    <div class="reading-progress" id="reading-progress"></div>

    <header class="topbar">
      <button class="icon-button mobile-menu" id="menu-toggle" aria-label="Open navigation">
        <i data-lucide="menu"></i>
      </button>

      <a class="brand" href="./" aria-label="swe-101 home">
        <span class="brand-mark">101</span>
        <span>
          <span class="brand-title">swe-101</span>
        </span>
      </a>

      <div class="topbar-actions">
        <button class="icon-button sidebar-toggle-top" data-sidebar-toggle aria-label="Show navigation">
          <i data-lucide="panel-left-open"></i>
        </button>
        <label class="search-box" for="global-search">
          <i data-lucide="search"></i>
          <input id="global-search" type="search" autocomplete="off" placeholder="Search notes" />
        </label>
        <button class="icon-button" id="theme-toggle" aria-label="Toggle theme">
          <i data-lucide="sun"></i>
        </button>
      </div>
    </header>

    <div class="shell">
      <aside class="sidebar" id="sidebar" aria-label="Documentation navigation">
        <div class="sidebar-section sidebar-primary">
          <button class="nav-home active" data-home>
            <i data-lucide="layout-dashboard"></i>
            Overview
          </button>
          <button class="icon-button sidebar-hide-button" data-sidebar-toggle aria-label="Hide navigation">
            <i data-lucide="panel-left-close"></i>
          </button>
        </div>
        <div class="sidebar-section" id="category-nav"></div>
      </aside>

      <main class="main">
        <section class="home-view" id="home-view">
          <div class="home-intro">
            <p class="eyebrow">Study library</p>
            <h1>Pick a topic. Open a note.</h1>
          </div>

          <section class="content-band">
            <div class="section-heading with-action">
              <span></span>
              <button class="text-button" id="topics-toggle" type="button">
                <i data-lucide="eye-off"></i>
                Hide topics
              </button>
            </div>
            <div class="category-grid" id="category-grid"></div>
          </section>

          <section class="content-band">
            <div class="section-heading with-action">
              <div>
                <p class="eyebrow">Library</p>
                <h2 id="library-title">All notes</h2>
              </div>
              <div class="library-actions">
                <button class="text-button hidden" id="clear-filter">
                  <i data-lucide="x"></i>
                  Clear
                </button>
                <button class="text-button" id="reset-progress" type="button">
                  <i data-lucide="rotate-ccw"></i>
                  Reset progress
                </button>
              </div>
            </div>
            <div class="tier-filter hidden" id="tier-filter" aria-label="High-level design tier filter">
              <button class="tier-chip active" type="button" data-tier="">All</button>
              <button class="tier-chip" type="button" data-tier="tier-1">Tier 1</button>
              <button class="tier-chip" type="button" data-tier="tier-2">Tier 2</button>
              <button class="tier-chip" type="button" data-tier="tier-3">Tier 3</button>
            </div>
            <div class="doc-list" id="doc-list"></div>
          </section>
        </section>

        <section class="doc-view hidden" id="doc-view" aria-live="polite">
          <div class="doc-toolbar">
            <div class="doc-toolbar-left">
              <button class="text-button" data-home>
                <i data-lucide="arrow-left"></i>
                All notes
              </button>
            </div>
            <div class="doc-toolbar-actions">
              <button class="text-button" id="toc-toggle" type="button">
                <i data-lucide="panel-right-close"></i>
                Outline
              </button>
              <button class="text-button" id="focus-toggle" type="button">
                <i data-lucide="maximize-2"></i>
                Focus
              </button>
              <button class="text-button" id="reset-doc-progress" type="button">
                <i data-lucide="rotate-ccw"></i>
                Reset this
              </button>
              <a class="text-button" id="source-link" href="#" target="_blank" rel="noreferrer">
                <i data-lucide="github"></i>
                Source
              </a>
            </div>
          </div>

          <div class="doc-layout">
            <article class="article-shell">
              <p class="eyebrow" id="doc-category">Topic</p>
              <h1 id="doc-title">Loading</h1>
              <p class="doc-description" id="doc-description"></p>
              <div class="article" id="article"></div>
            </article>

            <nav class="toc" id="toc" aria-label="Table of contents">
              <p>On this page</p>
              <div id="toc-links"></div>
            </nav>
          </div>
        </section>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/java.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11.6.0/dist/mermaid.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script src="app.js?v=24"></script>
  </body>
</html>
